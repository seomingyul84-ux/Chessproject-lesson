<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체스 레슨</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="lib/chessboard-1.0.0.css"> 
    <link rel="stylesheet" href="styles.css"> 

</head>
<body>
    <div class="container">
        <a href="/" class="home-button">홈</a> 
        
        <div id="main-container">
            
            <div class="chessboard-area">
                <h2></h2> 
                <div id="board" style="width: 500px"></div> 
            </div>

            <div class="lesson-content">
                
                <div id="feedback-panel">
                    <div id="feedback-message">레슨이 준비되었습니다.</div>
                </div>
                
                <div id="content-panel">
                    <h2>레슨 내용</h2>
                    <div id="lesson-description"></div>
                    
                    <div class="hint-container">
                        <button id="toggle-hint-btn" onclick="toggleHint()">힌트 보기</button>
                        <p id="hint-text" style="display: none;"></p>
                    </div>

                    <button id="next-step-btn" style="display: none;">다음 단계로 이동</button>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/chessboard-1.0.0.min.js"></script>
    <script src="lib/chess.min.js"></script>

    <script src="lessons.js"></script>
    <script src="main.js"></script>
</body>
</html>
