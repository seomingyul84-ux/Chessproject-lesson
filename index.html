<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체스 레슨</title>

    <link rel="stylesheet" href="lib/chessboard.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="/" class="home-button">홈</a>

    <div class="main-container">

        <div class="chessboard-area">
            <h2>체스보드</h2>
            <div id="board"></div>
        </div>

        <div class="right-panel">

            <div id="feedback-panel" class="panel-section">
                정답/오답
                <p id="feedback-message">레슨이 준비되었습니다.</p>
            </div>

            <div id="content-panel" class="panel-section">
                <h3>레슨 내용</h3>
                <p id="lesson-description"></p>
                <button onclick="toggleHint()">힌트 보기</button>
                <p id="hint-text" style="color: gray; display: none; margin-top: 10px;"></p>
            </div>
        </div>
    </div>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="lib/chessboard-1.0.0.min.js"></script>
    <script src="lib/chess.min.js"></script>

    <script src="lessons.js"></script>
    <script src="main.js"></script>
</body>
</html>
